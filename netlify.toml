# Publicación en Netlify (plan gratuito, uso comercial permitido).
# Netlify detecta Next.js y aplica su adaptador automáticamente.
# Las variables de entorno (claves de Supabase y NEXT_PUBLIC_SITE_URL) se
# configuran en el panel de Netlify, nunca en este archivo.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
